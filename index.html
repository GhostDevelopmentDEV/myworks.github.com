        // ==================== МОДАЛЬНОЕ ОКНО НАСТРОЕК ====================
        function createSettingsButton() {
            const btn = document.createElement('button');
            btn.className = 'settings-toggle';
            btn.id = 'settings-toggle';
            btn.title = 'Open settings';
            btn.setAttribute('aria-label', 'Open settings');
            btn.innerHTML = '<i class="fas fa-cog"></i>';
            document.body.appendChild(btn);
            return btn;
        }

        function createSettingsModal() {
            const existing = document.getElementById('settings-modal-overlay');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.className = 'settings-modal-overlay';
            overlay.id = 'settings-modal-overlay';

            overlay.innerHTML = `
                <div class="settings-modal">
                    <div class="settings-header">
                        <h3><i class="fas fa-cog"></i> Settings</h3>
                        <button class="settings-close" id="settings-close">&times;</button>
                    </div>
                    <div class="settings-tabs">
                        <button class="settings-tab active" data-tab="general">General</button>
                        <button class="settings-tab" data-tab="appearance">Appearance</button>
                        <button class="settings-tab" data-tab="data">Data</button>
                        <button class="settings-tab" data-tab="about">About</button>
                        <button class="settings-tab disabled" data-tab="extra" disabled>Extra</button>
                    </div>
                    <div class="settings-content" id="settings-content"></div>
                </div>
            `;
            document.body.appendChild(overlay);

            const settingsBtn = document.getElementById('settings-toggle');
            const closeBtn = overlay.querySelector('#settings-close');
            const tabs = overlay.querySelectorAll('.settings-tab:not(.disabled)');

            const openModal = () => {
                overlay.classList.add('open');
                const activeTab = overlay.querySelector('.settings-tab.active');
                if (activeTab && !activeTab.classList.contains('disabled')) {
                    renderSettingsTab(activeTab.dataset.tab);
                } else {
                    renderSettingsTab('general');
                }
            };
            const closeModal = () => overlay.classList.remove('open');

            settingsBtn?.addEventListener('click', openModal);
            closeBtn?.addEventListener('click', closeModal);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeModal();
            });

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const tabName = tab.dataset.tab;
                    renderSettingsTab(tabName);
                });
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('open')) {
                    closeModal();
                }
            });
        }

        function renderSettingsTab(tabName) {
            const content = document.getElementById('settings-content');
            if (!content) return;

            switch (tabName) {
                case 'general':
                    content.innerHTML = `
                        <div class="setting-row">
                            <span class="setting-label"><i class="fas fa-film"></i> Animations</span>
                            <label class="switch">
                                <input type="checkbox" id="setting-animations" ${settings.animations ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="setting-row">
                            <span class="setting-label"><i class="fas fa-snowflake"></i> Banner particles</span>
                            <label class="switch">
                                <input type="checkbox" id="setting-particles" ${settings.particles ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="setting-row">
                            <span class="setting-label"><i class="fas fa-chevron-up"></i> Fade-up effect</span>
                            <label class="switch">
                                <input type="checkbox" id="setting-fadeUp" ${settings.fadeUp ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </div>
                    `;
                    document.getElementById('setting-animations')?.addEventListener('change', (e) => {
                        settings.animations = e.target.checked;
                        saveSettings();
                        applyAnimationsSettings();
                        showToast('Animations ' + (settings.animations ? 'enabled' : 'disabled'));
                    });
                    document.getElementById('setting-particles')?.addEventListener('change', (e) => {
                        settings.particles = e.target.checked;
                        saveSettings();
                        if (settings.particles) {
                            createBannerParticles();
                        } else {
                            removeBannerParticles();
                        }
                        showToast('Banner particles ' + (settings.particles ? 'enabled' : 'disabled'));
                    });
                    document.getElementById('setting-fadeUp')?.addEventListener('change', (e) => {
                        settings.fadeUp = e.target.checked;
                        saveSettings();
                        showToast('Fade-up effect ' + (settings.fadeUp ? 'enabled' : 'disabled'));
                    });
                    break;

                case 'appearance':
                    content.innerHTML = `
                        <p style="color: var(--text-light); margin-bottom: 16px;">Choose your preferred color scheme</p>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="theme" value="system" ${settings.themePreference === 'system' ? 'checked' : ''}>
                                <i class="fas fa-desktop"></i> System
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="theme" value="light" ${settings.themePreference === 'light' ? 'checked' : ''}>
                                <i class="fas fa-sun"></i> Light
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="theme" value="dark" ${settings.themePreference === 'dark' ? 'checked' : ''}>
                                <i class="fas fa-moon"></i> Dark
                            </label>
                        </div>
                    `;
                    document.querySelectorAll('input[name="theme"]').forEach(radio => {
                        radio.addEventListener('change', (e) => {
                            settings.themePreference = e.target.value;
                            saveSettings();
                            applyThemePreference();
                            showToast('Theme updated');
                        });
                    });
                    break;

                case 'data':
                    content.innerHTML = `
                        <div class="setting-row">
                            <span class="setting-label"><i class="fas fa-code"></i> Show language tag</span>
                            <label class="switch">
                                <input type="checkbox" id="setting-showLanguage" ${settings.showLanguage ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="setting-row">
                            <span class="setting-label"><i class="far fa-star"></i> Show stars count</span>
                            <label class="switch">
                                <input type="checkbox" id="setting-showStars" ${settings.showStars ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="setting-row">
                            <span class="setting-label"><i class="fas fa-code-branch"></i> Show forks count</span>
                            <label class="switch">
                                <input type="checkbox" id="setting-showForks" ${settings.showForks ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="setting-row">
                            <span class="setting-label"><i class="fas fa-align-left"></i> Show description</span>
                            <label class="switch">
                                <input type="checkbox" id="setting-showDescription" ${settings.showDescription ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div style="margin-top: 16px;">
                            <button class="btn-settings secondary" id="clear-cache-btn"><i class="fas fa-broom"></i> Clear cache & reload</button>
                            <button class="btn-settings secondary" id="reload-data-btn"><i class="fas fa-sync-alt"></i> Reload data</button>
                        </div>
                    `;
                    document.getElementById('setting-showLanguage')?.addEventListener('change', (e) => {
                        settings.showLanguage = e.target.checked;
                        saveSettings();
                        if (currentTab === 'repos') renderAppTabsContent(currentSelectedLanguages);
                    });
                    document.getElementById('setting-showStars')?.addEventListener('change', (e) => {
                        settings.showStars = e.target.checked;
                        saveSettings();
                        if (currentTab === 'repos') renderAppTabsContent(currentSelectedLanguages);
                    });
                    document.getElementById('setting-showForks')?.addEventListener('change', (e) => {
                        settings.showForks = e.target.checked;
                        saveSettings();
                        if (currentTab === 'repos') renderAppTabsContent(currentSelectedLanguages);
                    });
                    document.getElementById('setting-showDescription')?.addEventListener('change', (e) => {
                        settings.showDescription = e.target.checked;
                        saveSettings();
                        if (currentTab === 'repos') renderAppTabsContent(currentSelectedLanguages);
                    });
                    document.getElementById('clear-cache-btn')?.addEventListener('click', () => {
                        localStorage.removeItem(CACHE_KEYS.profile);
                        localStorage.removeItem(CACHE_KEYS.repos);
                        localStorage.removeItem(CACHE_KEYS.timestamp);
                        showToast('Cache cleared. Reloading...', 'fa-check');
                        fetchGitHubData();
                        document.getElementById('settings-modal-overlay').classList.remove('open');
                    });
                    document.getElementById('reload-data-btn')?.addEventListener('click', () => {
                        fetchGitHubData();
                        showToast('Reloading data...', 'fa-sync-alt');
                        document.getElementById('settings-modal-overlay').classList.remove('open');
                    });
                    break;

                case 'about':
                    content.innerHTML = `
                        <div class="settings-about">
                            <p><strong>GhostDEV Developer Profile</strong></p>
                            <p>Version: ${WEBSITE_APP_VERSION}</p>
                            <p>Built with GitHub REST API and vanilla JavaScript.</p>
                            <p>Customizable settings allow you to control which repository details are shown.</p>
                            <p style="margin-top: 10px;"><a href="https://github.com/${GITHUB_USERNAME}" target="_blank" class="link-item" style="display: inline-flex;"><i class="fab fa-github"></i> ${GITHUB_USERNAME}</a></p>
                        </div>
                        <div class="setting-row" style="margin-top: 20px;">
                            <span class="setting-label">Nothing</span>
                            <label class="switch">
                                <input type="checkbox" id="nothing-toggle">
                                <span class="slider"></span>
                            </label>
                        </div>
                    `;
                    document.getElementById('nothing-toggle')?.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            showToast('Nothing happened.', 'fa-circle-info');
                            e.target.checked = false;
                        }
                    });
                    break;

                default:
                    content.innerHTML = '<p style="color: var(--text-light);">Select a settings category.</p>';
            }
        }

        // ==================== СТАРТ ПРИЛОЖЕНИЯ ====================
        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            loadSettings();
            applyAnimationsSettings();

            const themeToggleBtn = document.getElementById('theme-toggle');
            if (themeToggleBtn) themeToggleBtn.addEventListener('click', toggleTheme);

            createSettingsButton();
            createSettingsModal();

            if (GITHUB_USERNAME === 'USERNAME') {
                document.getElementById('checking-access').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                appElement.innerHTML = `<div class="error-message"><h3><i class="fas fa-exclamation-triangle"></i> Configuration Required</h3><p>Please replace <code>YOUR_GITHUB_USERNAME</code> in the JavaScript code with your actual GitHub username.</p></div>`;
                return;
            }
            const proceed = await checkConfigAndRedirect();
            if (proceed) {
                document.getElementById('checking-access').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                fetchGitHubData();
            }
        });
    </script>
</body>

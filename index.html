<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile | GhostDEV</title>
    <meta name="theme-color" content="#0d1117">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========== ОРИГИНАЛЬНЫЕ СТИЛИ БЕЗ ИЗМЕНЕНИЙ ========== */
        :root {
            --primary: #238636;
            --primary-dark: #2ea043;
            --secondary: #1f6feb;
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --bg-card-light: #21262d;
            --text: #c9d1d9;
            --text-light: #8b949e;
            --border: #30363d;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            --radius: 12px;
            --glow: rgba(35, 134, 54, 0.3);
            --toast-bg: #161b22;
            --toast-text: #c9d1d9;
            --scrollbar-thumb: #30363d;
            --scrollbar-track: #0d1117;
            --input-bg: #0d1117;
            --input-border: #30363d;
            --input-focus: #238636;
            --hover-overlay: rgba(255, 255, 255, 0.03);
            --banner-overlay-1: rgba(13, 65, 157, 0.85);
            --banner-overlay-2: rgba(35, 134, 54, 0.85);
        }

        [data-theme="light"] {
            --primary: #238636;
            --primary-dark: #2ea043;
            --secondary: #1f6feb;
            --bg-dark: #f6f8fa;
            --bg-card: #ffffff;
            --bg-card-light: #f0f2f5;
            --text: #1f2328;
            --text-light: #656d76;
            --border: #d0d7de;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            --glow: rgba(35, 134, 54, 0.2);
            --toast-bg: #ffffff;
            --toast-text: #1f2328;
            --scrollbar-thumb: #c1c7cd;
            --scrollbar-track: #f6f8fa;
            --input-bg: #ffffff;
            --input-border: #d0d7de;
            --input-focus: #238636;
            --hover-overlay: rgba(0, 0, 0, 0.03);
            --banner-overlay-1: rgba(13, 65, 157, 0.7);
            --banner-overlay-2: rgba(35, 134, 54, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 40px;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        body.no-animations * {
            animation-duration: 0s !important;
            transition-duration: 0s !important;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2rem;
            color: var(--text-light);
        }

        .error-message {
            background-color: rgba(248, 81, 73, 0.1);
            border: 1px solid #f85149;
            color: #f85149;
            padding: 20px;
            border-radius: var(--radius);
            margin: 20px 0;
            text-align: center;
        }

        .profile-header {
            position: relative;
            margin-top: 20px;
            margin-bottom: 40px;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: box-shadow 0.3s ease;
        }

        .banner {
            height: 250px;
            background: linear-gradient(135deg, var(--banner-overlay-1) 0%, var(--banner-overlay-2) 100%);
            position: relative;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            transition: background-position 0.1s ease-out;
        }

        .banner-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .banner-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0.6;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100%) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.2;
            }
            100% {
                transform: translateY(-100%) translateX(40px) scale(1.5);
                opacity: 0;
            }
        }

        .profile-info {
            background-color: var(--bg-card);
            padding: 30px;
            padding-top: 80px;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 30px;
            transition: background-color 0.3s ease;
        }

        .avatar-container {
            position: absolute;
            top: -80px;
            left: 30px;
        }

        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 6px solid var(--bg-card);
            background-color: #333;
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow);
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
        }
        .avatar:hover {
            transform: scale(1.03);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .online-indicator {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 20px;
            height: 20px;
            background: #2ea043;
            border-radius: 50%;
            border: 4px solid var(--bg-card);
            transition: border-color 0.3s ease;
            animation: pulse-dot 2s infinite;
            z-index: 2;
        }
        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(46, 160, 67, 0.6); }
            50% { box-shadow: 0 0 0 12px rgba(46, 160, 67, 0); }
        }

        .name-section {
            flex: 1;
            min-width: 300px;
        }

        .username-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .username {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text);
            transition: color 0.3s ease;
        }

        .copy-username-btn {
            background: var(--bg-card-light);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .copy-username-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .copy-username-btn.copied {
            background: #2ea043;
            color: #fff;
            border-color: #2ea043;
        }

        .verified-badge {
            background-color: #2ea043;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            position: relative;
            cursor: help;
            flex-shrink: 0;
        }

        .verified-badge::after {
            content: attr(data-tooltip);
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 10;
        }

        .verified-badge:hover::after {
            opacity: 1;
        }

        .user-title {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 20px;
            transition: color 0.3s ease;
        }

        .bio {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 20px;
            max-width: 600px;
            transition: color 0.3s ease;
            min-height: 3em;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-top: 15px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            cursor: default;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            transition: color 0.3s ease;
        }
        .stat-value.counting {
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-light);
            transition: color 0.3s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            transform: rotate(30deg) scale(1.1);
            border-color: var(--primary);
        }
        @media (max-width: 768px) {
            .theme-toggle {
                top: 10px;
                right: 10px;
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
        }

        /* ========== КНОПКА НАСТРОЕК ========== */
        .settings-toggle {
            position: fixed;
            top: 20px;
            right: 76px;
            z-index: 1000;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        .settings-toggle:hover {
            transform: scale(1.1);
            border-color: var(--primary);
        }
        @media (max-width: 768px) {
            .settings-toggle {
                top: 10px;
                right: 60px;
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
        }

        @media (max-width: 992px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .posts-section {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s ease;
        }

        .section-title i {
            color: var(--primary);
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 350px;
        }
        .search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 25px;
            color: var(--text);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--glow);
        }
        .search-input::placeholder {
            color: var(--text-light);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 0.9rem;
            pointer-events: none;
            transition: color 0.3s;
        }
        .search-input:focus~.search-icon,
        .search-wrapper:focus-within .search-icon {
            color: var(--primary);
        }
        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 0.85rem;
            display: none;
            padding: 4px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .search-clear:hover {
            color: var(--text);
            background: var(--bg-card-light);
        }
        .search-clear.visible {
            display: flex;
        }

        .tabs {
            display: flex;
            gap: 10px;
            background-color: var(--bg-card-light);
            padding: 4px;
            border-radius: 30px;
            transition: background-color 0.3s ease;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-light);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .tab-btn:hover:not(.active) {
            color: var(--text);
        }

        .sort-wrapper {
            position: relative;
        }
        .sort-select {
            appearance: none;
            -webkit-appearance: none;
            background: var(--bg-card-light);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 32px 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .sort-select:hover {
            border-color: var(--primary);
        }
        .sort-select:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--glow);
        }
        .sort-wrapper::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-light);
            font-size: 0.7rem;
        }

        /* ========== ФИЛЬТР ЯЗЫКОВ ========== */
        .language-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            align-items: center;
        }
        .lang-chip {
            background: var(--bg-card-light);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .lang-chip.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .lang-chip:hover {
            border-color: var(--primary);
            color: var(--text);
        }
        .lang-chip .count {
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
            font-size: 0.75rem;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            transition: all 0.3s ease;
        }
        .posts-grid.list-view {
            grid-template-columns: 1fr;
        }
        .posts-grid.list-view .post {
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
        }
        .posts-grid.list-view .post-header {
            flex: 1;
            min-width: 250px;
        }
        .posts-grid.list-view .post-description {
            flex: 1;
            min-width: 200px;
            margin-bottom: 0;
        }
        .posts-grid.list-view .post-tags,
        .posts-grid.list-view .post-link,
        .posts-grid.list-view .like-btn {
            margin: 0;
        }

        .post {
            background-color: var(--bg-card-light);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .post:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border-color: var(--primary);
        }
        [data-theme="light"] .post:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .post::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: var(--radius);
            background: transparent;
            z-index: -1;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .post:hover::before {
            background: var(--glow);
            filter: blur(20px);
            opacity: 0.5;
        }

        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
        }

        .post-icon {
            width: 40px;
            height: 40px;
            background-color: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        .post-title {
            font-weight: 600;
            color: var(--text);
            font-size: 1.1rem;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.3s ease;
        }

        .post-date {
            font-size: 0.85rem;
            color: var(--text-light);
            transition: color 0.3s ease;
        }

        .post-description {
            color: var(--text-light);
            margin-bottom: 20px;
            flex: 1;
            font-size: 0.95rem;
            line-height: 1.5;
            transition: color 0.3s ease;
        }

        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            min-height: 28px;
        }

        .tag {
            background-color: rgba(31, 111, 235, 0.15);
            color: var(--secondary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tag i {
            font-size: 0.7rem;
        }

        .post-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: auto;
        }

        .post-link:hover {
            background-color: var(--primary-dark);
            transform: scale(1.03);
        }

        .like-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1rem;
            margin-left: auto;
            transition: color 0.3s, transform 0.2s;
            padding: 5px;
            flex-shrink: 0;
        }

        .like-btn.liked {
            color: #f85149;
            animation: heart-pop 0.4s ease;
        }
        @keyframes heart-pop {
            0% { transform: scale(1); }
            30% { transform: scale(1.4); }
            60% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .confetti-heart {
            position: fixed;
            font-size: 1.2rem;
            pointer-events: none;
            animation: confetti-fall 1s ease-out forwards;
            z-index: 2000;
        }
        @keyframes confetti-fall {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
            grid-column: 1 / -1;
        }
        .no-results i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
            opacity: 0.5;
        }
        .no-results p {
            font-size: 1.1rem;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .sidebar-widget {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .widget-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s ease;
        }

        .widget-title i {
            color: var(--primary);
        }

        .links-list {

<body>
    <div id="checking-access" style="display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text-light); font-size: 1.2rem;">
        <i class="fas fa-spinner fa-spin" style="margin-right: 10px;"></i> Checking access...
    </div>

    <div class="scroll-progress" id="scroll-progress"></div>
    <div class="container" id="app" style="display: none;"></div>

    <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme">
        <i class="fas fa-sun"></i>
    </button>
    <!-- Кнопка настроек будет добавлена через JS -->

    <button class="back-to-top" id="back-to-top" title="Back to top" aria-label="Back to top">
        <i class="fas fa-chevron-up"></i>
    </button>

    <div class="toast-container" id="toast-container"></div>

    <script>
        // ==================== КОНФИГУРАЦИЯ (НЕ ТРОГАЕМ ОРИГИНАЛ) ====================
        const GITHUB_USERNAME = 'GhostDevelopmentDEV';
        const WEBSITE_APP_VERSION = 0.5;
        const CONFIG_URL = 'https://raw.githubusercontent.com/GhostDevelopmentDEV/myworks_site_config/main/myworks_site_config';

        const BANNER_IMAGE = 'banner1.jpg';
        const SHOW_VERIFIED_BADGE = true;
        const VERIFIED_BADGE_TOOLTIP = 'Official page of GhostDEV';
        const SHOW_LANGUAGE = true;
        const SHOW_STARS = true;
        const SHOW_FORKS = false;
        const SHOW_DESCRIPTION = true;
        const MAX_REPOS = 20;

        const CUSTOM_REPO_TAGS = {
            "myworks.github.com": ["You are here", "V0.4"],
            "myworks_site_config": ["Maintenance", "V0.1.1"]
        }

        const BANNER_GRADIENT_START = '#ffffff';
        const BANNER_GRADIENT_END = '#000000';

        const MY_POSTS = [
            { title: "test", description: "this is just a test post", date: "2026-02-22", icon: "fa-brands fa-dev", tags: ["dev", "test"], link: "" },
            { title: "V0.3 RELEASED!", description: "Website updated! Now it has posts!", date: "2026-02-22", icon: "fa-solid fa-check", tags: ["0.3"], link: "https://github.com/GhostDevelopmentDEV/myworks.github.com/releases/tag/v0.3" },
            { title: "С 23 февраля!", description: "Поздравляю всех мужчин с днём защитника отечества!", date: "2026-02-23", icon: "fa-solid fa-award", tags: ["Russia", "🇷🇺"], link: "" },
            { title: "Comeback?", description: "Что-то давно я уже посты не писал на сайте... Да и на сам сайт тоже не заходил собственно", date: "2026-05-29", icon: "fa-solid fa-mug-saucer", tags: ["🇷🇺"], link: "" },
            { title: "New update! V0.4", description: "New update published!", date: "2026-05-29", icon: "fa-solid fa-check", tags: ["0.4"], link: "https://github.com/GhostDevelopmentDEV/myworks.github.com/releases/tag/v0.4" },
            { title: "Major update! V0.5", description: "New major update is here!", date: "2026-06-04", icon: "fa-solid fa-check", tags: ["0.5"], link: "https://github.com/GhostDevelopmentDEV/myworks.github.com/releases/tag/v0.5" }
        ];

        // ==================== РАСШИРЕННЫЕ НАСТРОЙКИ ====================
        const DEFAULT_SETTINGS = {
            themePreference: 'system',
            animations: true,
            particles: true,
            fadeUp: true,
            showLanguage: SHOW_LANGUAGE,
            showStars: SHOW_STARS,
            showForks: SHOW_FORKS,
            showDescription: SHOW_DESCRIPTION
        };
        let settings = { ...DEFAULT_SETTINGS };

        function loadSettings() {
            try {
                const raw = localStorage.getItem('ghostdev-settings');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    settings = { ...DEFAULT_SETTINGS, ...parsed };
                } else {
                    settings = { ...DEFAULT_SETTINGS };
                }
            } catch (e) {
                settings = { ...DEFAULT_SETTINGS };
            }
            applyAnimationsSettings();
        }
        function saveSettings() {
            localStorage.setItem('ghostdev-settings', JSON.stringify(settings));
        }

        function applyAnimationsSettings() {
            document.body.classList.toggle('no-animations', !settings.animations);
        }

        // ==================== СОСТОЯНИЕ ====================
        const state = {
            profile: null,
            repositories: [],
            allRepositories: [],
            activities: [],
            loading: true,
            error: null
        };

        const appElement = document.getElementById('app');
        const API_BASE = 'https://api.github.com';
        const PROFILE_ENDPOINT = `${API_BASE}/users/${GITHUB_USERNAME}`;
        const REPOS_ENDPOINT = `${API_BASE}/users/${GITHUB_USERNAME}/repos?sort=updated&direction=desc&per_page=${MAX_REPOS}`;
        const EVENTS_ENDPOINT = `${API_BASE}/users/${GITHUB_USERNAME}/events?per_page=20`;

        // ==================== УТИЛИТЫ КЭШИРОВАНИЯ ====================
        const CACHE_KEYS = {
            profile: 'ghostdev_profile_cache',
            repos: 'ghostdev_repos_cache',
            timestamp: 'ghostdev_cache_ts'
        };
        const CACHE_TTL = 5 * 60 * 1000;

        function getCachedData(key) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch { return null; }
        }

        function setCachedData(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
            } catch {}
        }

        function isCacheFresh() {
            const ts = localStorage.getItem(CACHE_KEYS.timestamp);
            if (!ts) return false;
            return (Date.now() - parseInt(ts, 10)) < CACHE_TTL;
        }

        function updateCacheTimestamp() {
            localStorage.setItem(CACHE_KEYS.timestamp, Date.now().toString());
        }

        // ==================== ПРОВЕРКА ТЕХ. ОБСЛУЖИВАНИЯ ====================
        function parseConfigFile(text) {
            const config = {};
            const lines = text.split('\n');
            for (let line of lines) {
                line = line.trim();
                if (line === '' || line.startsWith('#')) continue;
                const eqIndex = line.indexOf('=');
                if (eqIndex === -1) continue;
                const key = line.substring(0, eqIndex).trim();
                const value = line.substring(eqIndex + 1).trim();
                config[key] = value;
            }
            return config;
        }

        async function checkConfigAndRedirect() {
            try {
                const response = await fetch(CONFIG_URL);
                if (!response.ok) throw new Error('Config fetch failed');
                const text = await response.text();
                const config = parseConfigFile(text);
                if (config['MaintenanceMode'] && config['MaintenanceMode'].toLowerCase() === 'true') {
                    const params = new URLSearchParams();
                    if (config['Description']) params.set('desc', config['Description']);
                    if (config['Reason']) params.set('reason', config['Reason']);
                    if (config['TimeStart']) params.set('timeStart', config['TimeStart']);
                    if (config['TimeFinish']) params.set('timeFinish', config['TimeFinish']);
                    window.location.href = 'MaintenancePage.html?' + params.toString();
                    return false;
                }
            } catch (err) {
                console.warn('Could not check maintenance config:', err);
            }
            return true;
        }

        // ==================== ЗАГРУЗКА ДАННЫХ (с кэшем) ====================
        async function fetchGitHubData() {
            try {
                if (isCacheFresh()) {
                    const cachedProfile = getCachedData(CACHE_KEYS.profile);
                    const cachedRepos = getCachedData(CACHE_KEYS.repos);
                    if (cachedProfile && cachedRepos) {
                        state.profile = cachedProfile;
                        state.allRepositories = cachedRepos;
                        state.repositories = [...cachedRepos];
                        state.loading = false;
                        renderApp();
                        fetchFreshData();
                        return;
                    }
                }
                await fetchFreshData();
            } catch (error) {
                console.error('Error fetching GitHub data:', error);
                state.error = error.message;
                state.loading = false;
                renderApp();
            }
        }

        async function fetchFreshData() {
            const [profileResponse, reposResponse, eventsResponse] = await Promise.all([
                fetch(PROFILE_ENDPOINT, { headers: { 'Accept': 'application/vnd.github+json' } }),
                fetch(REPOS_ENDPOINT, { headers: { 'Accept': 'application/vnd.github+json' } }),
                fetch(EVENTS_ENDPOINT, { headers: { 'Accept': 'application/vnd.github+json' } }).catch(() => null)
            ]);

            if (!profileResponse.ok) throw new Error(`Failed to fetch profile: ${profileResponse.status}`);
            const profile = await profileResponse.json();
            const repos = reposResponse.ok ? await reposResponse.json() : [];
            const events = eventsResponse && eventsResponse.ok ? await eventsResponse.json() : [];

            state.profile = profile;
            state.allRepositories = repos;
            state.repositories = [...repos];
            state.activities = events;
            state.loading = false;

            setCachedData(CACHE_KEYS.profile, profile);
            setCachedData(CACHE_KEYS.repos, repos);
            updateCacheTimestamp();

            renderApp();
        }

        // ==================== ФОРМАТИРОВАНИЕ ====================
        function formatRelativeTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);
            if (diffInSeconds < 60) return 'just now';
            if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)} minutes ago`;
            if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)} hours ago`;
            if (diffInSeconds < 604800) return `${Math.floor(diffInSeconds / 86400)} days ago`;
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatDate(dateString) {
            const d = new Date(dateString);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function getLanguageColor(language) {
            const colors = {
                'JavaScript': '#f1e05a', 'TypeScript': '#3178c6', 'Python': '#3572A5', 'Java': '#b07219',
                'Go': '#00ADD8', 'Rust': '#dea584', 'C++': '#f34b7d', 'C#': '#178600', 'PHP': '#4F5D95',
                'Ruby': '#701516', 'Swift': '#ffac45', 'Kotlin': '#A97BFF', 'HTML': '#e34c26', 'CSS': '#563d7c',
                'Shell': '#89e051', 'Vue': '#41b883', 'Dockerfile': '#384d54',
            };
            return colors[language] || '#8b949e';
        }

        function getCustomTagsForRepo(repoName) {
            const lowerName = repoName.toLowerCase();
            for (const [key, tags] of Object.entries(CUSTOM_REPO_TAGS)) {
                if (lowerName === key.toLowerCase()) return tags;
            }
            return [];
        }

        // ==================== ТОСТЫ ====================
        function showToast(message, icon = 'fa-check-circle', duration = 2500) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, duration + 400);
        }

        // ==================== КОНФЕТТИ-СЕРДЕЧКИ ====================
        function spawnHearts(x, y) {
            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('span');
                heart.className = 'confetti-heart';
                heart.innerHTML = ['❤️','💕','💖','💗','💝'][i % 5];
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                heart.style.setProperty('--x', (Math.random() * 80 - 40) + 'px');
                heart.style.setProperty('--y', (-Math.random() * 60 - 20) + 'px');
                document.body.appendChild(heart);
                heart.addEventListener('animationend', () => heart.remove());
            }
        }

        // ==================== ФИЛЬТРАЦИЯ И СОРТИРОВКА ====================
        function filterAndSortRepos(searchTerm, sortBy, selectedLanguages = []) {
            let filtered = [...state.allRepositories];
            if (searchTerm.trim()) {
                const term = searchTerm.toLowerCase().trim();
                filtered = filtered.filter(repo => {
                    return repo.name.toLowerCase().includes(term) ||
                        (repo.description && repo.description.toLowerCase().includes(term)) ||
                        (repo.language && repo.language.toLowerCase().includes(term)) ||
                        getCustomTagsForRepo(repo.name).some(tag => tag.toLowerCase().includes(term));
                });
            }
            if (selectedLanguages.length > 0) {
                filtered = filtered.filter(repo => selectedLanguages.includes(repo.language));
            }
            switch (sortBy) {
                case 'stars': filtered.sort((a, b) => b.stargazers_count - a.stargazers_count); break;
                case 'name': filtered.sort((a, b) => a.name.localeCompare(b.name)); break;
                default: filtered.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            }
            state.repositories = filtered;
        }

        function filterPosts(searchTerm, sortOrder = 'desc') {
            let posts = MY_POSTS;
            if (searchTerm.trim()) {
                const term = searchTerm.toLowerCase().trim();
                posts = posts.filter(post => post.title.toLowerCase().includes(term) || post.description.toLowerCase().includes(term) || post.tags.some(tag => tag.toLowerCase().includes(term)));
            }
            posts.sort((a, b) => sortOrder === 'asc' ? new Date(a.date) - new Date(b.date) : new Date(b.date) - new Date(a.date));
            return posts;
        }

        // ==================== ГЕНЕРАЦИЯ HTML ====================
        function generateRepositoriesHTML(repos) {
            if (!repos.length) return `<div class="no-results"><i class="fas fa-search"></i><p>No repositories match your search.</p></div>`;
            return repos.map(repo => {
                const customTags = getCustomTagsForRepo(repo.name);
                const tags = [];
                if (settings.showLanguage && repo.language) {
                    const color = getLanguageColor(repo.language);
                    tags.push(`<span class="tag" style="background-color: ${color}20; color: ${color}"><span style="background-color: ${color}; width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px;"></span>${repo.language}</span>`);
                }
                if (settings.showStars && repo.stargazers_count > 0) tags.push(`<span class="tag"><i class="far fa-star"></i> ${repo.stargazers_count}</span>`);
                if (settings.showForks && repo.forks_count > 0) tags.push(`<span class="tag"><i class="fas fa-code-branch"></i> ${repo.forks_count}</span>`);
                customTags.forEach(tag => tags.push(`<span class="tag" style="background-color: rgba(35, 134, 54, 0.15); color: #2ea043;">${tag}</span>`));
                return `
                <article class="post fade-up" data-repo="${repo.name}">
                    <div class="post-header">
                        <div class="post-icon"><i class="fab fa-github"></i></div>
                        <div class="post-title" title="${repo.name}">${repo.name}</div>
                        <div class="post-date">${formatRelativeTime(repo.updated_at)}</div>
                        <button class="like-btn" title="Like"><i class="far fa-heart"></i></button>
                    </div>
                    ${settings.showDescription ? `<p class="post-description">${repo.description || 'No description provided.'}</p>` : ''}
                    <div class="post-tags">${tags.join('')}</div>
                    <a href="${repo.html_url}" class="post-link" target="_blank"><i class="fab fa-github"></i> View Repository</a>
                </article>`;
            }).join('');
        }

        function generatePostsHTML(posts) {
            if (!posts.length) return `<div class="no-results"><i class="fas fa-search"></i><p>No posts match your search.</p></div>`;
            return posts.map(post => {
                const tags = post.tags.map(tag => `<span class="tag" style="background-color: rgba(31, 111, 235, 0.15); color: #1f6feb;">${tag}</span>`).join('');
                const linkHTML = post.link ? `<a href="${post.link}" class="post-link" target="_blank"><i class="fas fa-book-open"></i> Read more</a>` : `<span class="post-link" style="background-color: var(--bg-card-light); color: var(--text-light); cursor: default; pointer-events: none;"><i class="fas fa-book-open"></i> Read more</span>`;
                const copyBtn = post.link ? `<button class="post-copy-link" data-link="${post.link}" title="Copy link"><i class="fas fa-link"></i></button>` : '';
                return `
                <article class="post fade-up">
                    <div class="post-header">
                        <div class="post-icon"><i class="${post.icon}"></i></div>
                        <div class="post-title" title="${post.title}">${post.title}</div>
                        <div class="post-date">${formatDate(post.date)}</div>
                        ${copyBtn}
                    </div>
                    <p class="post-description">${post.description}</p>
                    <div class="post-tags">${tags}</div>
                    ${linkHTML}
                </article>`;
            }).join('');
        }

        function generateActivitiesHTML(activities) {
            if (!activities.length) return `<div class="no-results"><i class="fas fa-history"></i><p>No recent activity found.</p></div>`;
            return activities.slice(0, 15).map(event => {
                let icon = 'fa-code-branch';
                let action = event.type.replace('Event', '');
                if (event.type === 'PushEvent') { icon = 'fa-upload'; action = `Pushed ${event.payload.commits?.length || 0} commits`; }
                else if (event.type === 'CreateEvent') { icon = 'fa-plus'; action = `Created ${event.payload.ref_type}`; }
                else if (event.type === 'WatchEvent') { icon = 'fa-star'; action = 'Starred'; }
                else if (event.type === 'ForkEvent') { icon = 'fa-code-fork'; action = 'Forked'; }
                else if (event.type === 'IssuesEvent') { icon = 'fa-circle-dot'; action = 'Opened issue'; }
                return `
                <article class="post fade-up">
                    <div class="post-header">
                        <div class="post-icon"><i class="fas ${icon}"></i></div>
                        <div class="post-title" style="font-size:0.95rem;">${action} in <strong>${event.repo.name}</strong></div>
                        <div class="post-date">${formatRelativeTime(event.created_at)}</div>
                    </div>
                </article>`;
            }).join('');
        }

        // ==================== ОБРАБОТЧИКИ ЛАЙКОВ ====================
        function attachLikeButtons(container) {
            container.querySelectorAll('.like-btn').forEach(btn => {
                btn.replaceWith(btn.cloneNode(true));
            });
            container.querySelectorAll('.like-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const icon = this.querySelector('i');
                    const rect = this.getBoundingClientRect();
                    const x = rect.left + rect.width/2;
                    const y = rect.top + rect.height/2;
                    if (icon.classList.contains('far')) {
                        icon.classList.remove('far');
                        icon.classList.add('fas');
                        this.classList.add('liked');
                        spawnHearts(x, y);
                        const repoName = this.closest('.post')?.getAttribute('data-repo');
                        showToast(repoName ? `Liked <strong>${repoName}</strong> ❤️` : 'Liked! ❤️', 'fa-heart');
                    } else {
                        icon.classList.remove('fas');
                        icon.classList.add('far');
                        this.classList.remove('liked');
                        showToast('Like removed', 'fa-heart-broken');
                    }
                });
            });
        }

        // ==================== АНИМАЦИЯ СЧЕТЧИКОВ ====================
        function animateCounters() {
            if (!settings.animations) return;
            const statValues = document.querySelectorAll('.stat-value');
            statValues.forEach(el => {
                const target = parseInt(el.textContent.replace(/,/g, ''), 10);
                if (isNaN(target)) return;
                const duration = 1500;
                const startTime = performance.now();
                el.classList.add('counting');
                function update(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    const current = Math.floor(target * eased);
                    el.textContent = current.toLocaleString();
                    if (progress < 1) requestAnimationFrame(update);
                    else {
                        el.textContent = target.toLocaleString();
                        el.classList.remove('counting');
                    }
                }
                requestAnimationFrame(update);
            });
        }

        // ==================== ТЕМА ====================
        function applyThemePreference() {
            const html = document.documentElement;
            if (settings.themePreference === 'system') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                html.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
                localStorage.removeItem('ghostdev-theme');
            } else {
                html.setAttribute('data-theme', settings.themePreference);
                localStorage.setItem('ghostdev-theme', settings.themePreference);
            }
            updateThemeIcon();
        }

        function initTheme() {
            const saved = localStorage.getItem('ghostdev-theme');
            if (saved === 'dark' || saved === 'light') {
                settings.themePreference = saved;
            } else {
                settings.themePreference = 'system';
            }
            applyThemePreference();

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (settings.themePreference === 'system') {
                    applyThemePreference();
                }
            });
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            settings.themePreference = next;
            saveSettings();
            applyThemePreference();
            showToast(`Switched to ${next} mode`, next === 'light' ? 'fa-sun' : 'fa-moon');
        }

        function updateThemeIcon() {
            const btn = document.getElementById('theme-toggle');
            if (!btn) return;
            const current = document.documentElement.getAttribute('data-theme');
            btn.innerHTML = current === 'light' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
            btn.title = current === 'light' ? 'Switch to dark mode' : 'Switch to light mode';
        }

        // ==================== ЧАСТИЦЫ БАННЕРА ====================
        function createBannerParticles() {
            if (!settings.particles) return;
            const banner = document.querySelector('.banner');
            if (!banner) return;
            const existing = banner.querySelector('.banner-particles');
            if (existing) existing.remove();
            const container = document.createElement('div');
            container.className = 'banner-particles';
            const colors = ['#ffffff', '#58a6ff', '#3fb950', '#f78166', '#d2a8ff'];
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (4 + Math.random() * 8) + 's';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.width = (2 + Math.random() * 5) + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.opacity = 0.5 + Math.random() * 0.3;
                container.appendChild(particle);
            }
            banner.appendChild(container);
        }

        function removeBannerParticles() {
            const banner = document.querySelector('.banner');
            if (banner) {
                const existing = banner.querySelector('.banner-particles');
                if (existing) existing.remove();
            }
        }

        // ==================== TYPEWRITER ДЛЯ BIO ====================
        function typewriterBio(element, text, speed = 30) {
            if (!element || !text || !settings.animations) {
                if (element) element.textContent = text || '';
                return;
            }
            element.textContent = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        // ==================== SHARE PROFILE ====================
        function shareProfile() {
            const url = `https://github.com/${GITHUB_USERNAME}`;
            if (navigator.share) {
                navigator.share({ title: `${state.profile.login} GitHub Profile`, url }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url).then(() => showToast('Profile link copied!', 'fa-link'));
            }
        }

        // ==================== РЕНДЕР ЯЗЫКОВОГО ФИЛЬТРА ====================
        function renderLanguageFilter(selectedLanguages = []) {
            const filterContainer = document.getElementById('language-filter');
            if (!filterContainer) return;
            const langCounts = {};
            state.allRepositories.forEach(repo => {
                if (repo.language) langCounts[repo.language] = (langCounts[repo.language] || 0) + 1;
            });
            const sorted = Object.entries(langCounts).sort((a,b) => b[1] - a[1]);
            filterContainer.innerHTML = sorted.map(([lang, count]) => {
                const active = selectedLanguages.includes(lang) ? 'active' : '';
                return `<span class="lang-chip ${active}" data-lang="${lang}">${lang}<span class="count">${count}</span></span>`;
            }).join('');
            filterContainer.querySelectorAll('.lang-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const lang = chip.dataset.lang;
                    if (selectedLanguages.includes(lang)) {
                        selectedLanguages = selectedLanguages.filter(l => l !== lang);
                    } else {
                        selectedLanguages.push(lang);
                    }
                    renderAppTabsContent(selectedLanguages);
                });
            });
        }

        // ==================== УПРАВЛЕНИЕ ТАБАМИ ====================
        let currentTab = 'repos';
        let currentSelectedLanguages = [];
        let currentView = 'grid';
        let postsSortOrder = 'desc';

        function renderRepos(postsGrid, sectionTitle, searchTerm, sortBy, selectedLanguages) {
            filterAndSortRepos(searchTerm || '', sortBy || 'updated', selectedLanguages);
            postsGrid.innerHTML = generateRepositoriesHTML(state.repositories);
            sectionTitle.innerHTML = '<i class="fas fa-code-branch"></i> Latest Projects';
            attachLikeButtons(postsGrid);
            renderLanguageFilter(selectedLanguages);
            document.getElementById('sort-wrapper').style.display = '';
            document.getElementById('view-toggle').style.display = '';
            document.getElementById('random-repo-btn').style.display = '';
        }

        function renderPosts(postsGrid, sectionTitle, searchTerm) {
            const filtered = filterPosts(searchTerm || '', postsSortOrder);
            postsGrid.innerHTML = generatePostsHTML(filtered);
            sectionTitle.innerHTML = '<i class="fas fa-pencil-alt"></i> My Posts';
            const filterContainer = document.getElementById('language-filter');
            if (filterContainer) filterContainer.innerHTML = '';
            document.getElementById('sort-wrapper').style.display = 'none';
            document.getElementById('view-toggle').style.display = 'none';
            document.getElementById('random-repo-btn').style.display = 'none';
            attachPostCopyButtons();
        }

        function renderActivities(postsGrid, sectionTitle, searchTerm) {
            const term = searchTerm?.toLowerCase().trim() || '';
            const filtered = term ? state.activities.filter(e => e.type.toLowerCase().includes(term) || e.repo.name.toLowerCase().includes(term)) : state.activities;
            postsGrid.innerHTML = generateActivitiesHTML(filtered);
            sectionTitle.innerHTML = '<i class="fas fa-chart-line"></i> Recent Activity';
            const filterContainer = document.getElementById('language-filter');
            if (filterContainer) filterContainer.innerHTML = '';
            document.getElementById('sort-wrapper').style.display = 'none';
            document.getElementById('view-toggle').style.display = 'none';
            document.getElementById('random-repo-btn').style.display = 'none';
        }

        function attachPostCopyButtons() {
            document.querySelectorAll('.post-copy-link').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const link = btn.dataset.link;
                    navigator.clipboard.writeText(link).then(() => showToast('Link copied!', 'fa-link'));
                });
            });
        }

        function applyViewMode() {
            const grid = document.getElementById('posts-grid');
            if (!grid) return;
            grid.classList.toggle('list-view', currentView === 'list');
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${currentView}`)?.classList.add('active');
        }

        function renderAppTabsContent(selectedLanguages = []) {
            const postsGrid = document.querySelector('.posts-grid');
            const sectionTitle = document.querySelector('.section-title');
            const searchInput = document.getElementById('search-input');
            const sortSelect = document.getElementById('sort-select');
            if (!postsGrid || !sectionTitle) return;
            const term = searchInput ? searchInput.value : '';
            const sortBy = sortSelect ? sortSelect.value : 'updated';
            if (currentTab === 'repos') {
                renderRepos(postsGrid, sectionTitle, term, sortBy, selectedLanguages);
            } else if (currentTab === 'posts') {
                renderPosts(postsGrid, sectionTitle, term);
            } else if (currentTab === 'activity') {
                renderActivities(postsGrid, sectionTitle, term);
            }
            applyViewMode();
            setTimeout(() => {
                if (settings.fadeUp) {
                    document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
                }
            }, 50);
        }

        // ==================== BACK TO TOP ====================
        function initBackToTop() {
            const btn = document.getElementById('back-to-top');
            if (!btn) return;
            window.addEventListener('scroll', () => {
                btn.classList.toggle('visible', window.scrollY > 500);
                updateScrollProgress();
            });
            btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }

        function updateScrollProgress() {
            const bar = document.getElementById('scroll-progress');
            if (!bar) return;
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
            bar.style.width = progress + '%';
        }

        // ==================== КОПИРОВАНИЕ ИМЕНИ ====================
        function initCopyUsername() {
            const btn = document.getElementById('copy-username-btn');
            if (!btn) return;
            btn.addEventListener('click', () => {
                const username = state.profile?.login || GITHUB_USERNAME;
                navigator.clipboard.writeText(username).then(() => {
                    btn.classList.add('copied');
                    btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    showToast('Username copied to clipboard!', 'fa-copy');
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                    }, 2000);
                }).catch(() => showToast('Failed to copy', 'fa-exclamation-triangle'));
            });
        }

        // ==================== ПАРАЛЛАКС БАННЕРА ====================
        function initBannerParallax() {
            const banner = document.querySelector('.banner');
            if (!banner) return;
            document.addEventListener('mousemove', (e) => {
                const rect = banner.getBoundingClientRect();
                if (rect.bottom < 0 || rect.top > window.innerHeight) return;
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                banner.style.backgroundPosition = `${50 + x * 10}% ${50 + y * 10}%`;
            });
        }

        // ==================== ТОП ЯЗЫКОВ ====================
        function renderTopLanguages() {
            const container = document.getElementById('top-languages');
            if (!container) return;
            const langCounts = {};
            let total = 0;
            state.allRepositories.forEach(repo => {
                if (repo.language) {
                    langCounts[repo.language] = (langCounts[repo.language] || 0) + 1;
                    total++;
                }
            });
            const sorted = Object.entries(langCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);
            container.innerHTML = sorted.map(([lang, count]) => {
                const percent = total > 0 ? ((count / total) * 100).toFixed(1) : 0;
                const color = getLanguageColor(lang);
                return `<div class="lang-bar-item">
                    <span class="lang-bar-name">${lang}</span>
                    <div class="lang-bar-track"><div class="lang-bar-fill" style="width: ${percent}%; background: ${color};"></div></div>
                    <span class="lang-bar-percent">${percent}%</span>
                </div>`;
            }).join('');
        }

        // ==================== ГЛАВНЫЙ РЕНДЕР ====================
        function renderApp() {
            if (state.error) {
                appElement.innerHTML = `<div class="error-message"><h3><i class="fas fa-exclamation-triangle"></i> Error Loading Profile</h3><p>${state.error}</p></div>`;
                return;
            }
            appElement.innerHTML = generateAppHTML();
            applyBannerImage();
            if (settings.particles) {
                createBannerParticles();
            }

            const postsGrid = document.querySelector('.posts-grid');
            const sectionTitle = document.querySelector('.section-title');
            const tabRepos = document.getElementById('tab-repos');
            const tabPosts = document.getElementById('tab-posts');
            const tabActivity = document.getElementById('tab-activity');
            const searchInput = document.getElementById('search-input');
            const searchClear = document.getElementById('search-clear');
            const sortSelect = document.getElementById('sort-select');

            const doSearch = () => {
                const term = searchInput.value;
                searchClear.classList.toggle('visible', term.trim().length > 0);
                renderAppTabsContent(currentSelectedLanguages);
            };

            if (searchInput && searchClear) {
                searchInput.addEventListener('input', doSearch);
                searchClear.addEventListener('click', () => {
                    searchInput.value = '';
                    searchClear.classList.remove('visible');
                    renderAppTabsContent(currentSelectedLanguages);
                    searchInput.focus();
                });
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                        e.preventDefault();
                        searchInput.focus();
                        searchInput.select();
                    }
                });
            }

            if (sortSelect) {
                sortSelect.addEventListener('change', () => {
                    if (currentTab === 'repos') renderAppTabsContent(currentSelectedLanguages);
                });
            }

            if (tabRepos) tabRepos.addEventListener('click', () => { currentTab = 'repos'; updateTabs(); renderAppTabsContent([]); });
            if (tabPosts) tabPosts.addEventListener('click', () => { currentTab = 'posts'; updateTabs(); renderAppTabsContent([]); });
            if (tabActivity) tabActivity.addEventListener('click', () => { currentTab = 'activity'; updateTabs(); renderAppTabsContent([]); });

            function updateTabs() {
                [tabRepos, tabPosts, tabActivity].forEach(t => t?.classList.remove('active'));
                if (currentTab === 'repos') tabRepos?.classList.add('active');
                else if (currentTab === 'posts') tabPosts?.classList.add('active');
                else if (currentTab === 'activity') tabActivity?.classList.add('active');
            }

            // Обработчики кнопок переключения вида
            document.getElementById('view-grid')?.addEventListener('click', () => { currentView = 'grid'; applyViewMode(); });
            document.getElementById('view-list')?.addEventListener('click', () => { currentView = 'list'; applyViewMode(); });
            // Случайный репозиторий
            document.getElementById('random-repo-btn')?.addEventListener('click', () => {
                if (state.repositories.length > 0) {
                    const randomRepo = state.repositories[Math.floor(Math.random() * state.repositories.length)];
                    window.open(randomRepo.html_url, '_blank');
                }
            });

            renderAppTabsContent([]);
            setTimeout(animateCounters, 300);
            initCopyUsername();
            initBackToTop();
            initBannerParallax();

            const bioEl = document.querySelector('.bio');
            if (bioEl && state.profile.bio) typewriterBio(bioEl, state.profile.bio);

            const shareBtn = document.getElementById('share-profile-btn');
            if (shareBtn) shareBtn.addEventListener('click', shareProfile);

            renderTopLanguages();
        }

        function applyBannerImage() {
            const banner = document.querySelector('.banner');
            if (!banner) return;
            if (BANNER_IMAGE) {
                banner.style.backgroundImage = `url('${BANNER_IMAGE}')`;
                banner.style.backgroundSize = 'cover';
                banner.style.backgroundPosition = 'center';
            } else {
                banner.style.background = `linear-gradient(135deg, ${BANNER_GRADIENT_START} 0%, ${BANNER_GRADIENT_END} 100%)`;
            }
        }
